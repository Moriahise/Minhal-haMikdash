name: Blaupause – Städtebau

# Rechnet täglich selbständig eine Runde (ein Jahr): Städte wachsen entlang
# ihrer Bauabschnitte, neue werden gegründet. Pläne ohne OSM-Abgleich oder
# mit alter Planversion werden dabei neu berechnet. Ergebnis: blaupause/data.
on:
  schedule:
    - cron: "41 3,9 * * *"          # Tageslauf und Nachholprüfung (UTC)
  workflow_run:
    workflows: ["Seker – Prospektion"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      runden:
        description: "Anzahl Runden (Jahre)"
        default: "1"
      neu:
        description: "Alle Pläne neu berechnen (ja/nein)"
        default: "nein"
  push:
    branches: [main]
    paths: ["staedtebau/**", "blaupause/**", "tests/test_staedtebau.py", ".github/workflows/blaupause.yml", ".github/scripts/verify-pages.sh"]

permissions:
  contents: read

concurrency:
  group: blaupause-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tests:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.event == 'schedule' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q tests/test_staedtebau.py

  runde:
    needs: tests
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: OSM-Extrakt zwischenspeichern (wöchentlich neu)
        id: woche
        run: echo "kw=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: .cache/osm
          key: osm-v2-${{ steps.woche.outputs.kw }}
      - name: Pläne und Runde rechnen
        env:
          EVENT: ${{ github.event_name }}
          RUNDEN: ${{ inputs.runden || '1' }}
          NEU: ${{ inputs.neu || 'nein' }}
        run: |
          if [ "$EVENT" != "workflow_dispatch" ]; then
            python -m staedtebau runde --taeglich
            exit 0
          fi
          case "$RUNDEN" in ''|*[!0-9]*) RUNDEN=1 ;; esac
          if [ "$NEU" = "ja" ]; then python -m staedtebau plaene --neu; fi
          python -m staedtebau runde -n "$RUNDEN"
      - name: Ergebnisse veröffentlichen
        run: |
          git config user.name "blaupause-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add blaupause
          if git diff --cached --quiet; then
            echo "Keine Änderungen."
            exit 0
          fi
          git commit -m "Blaupause: Runde $(date -u +%F) – Städte und Pläne fortgeschrieben"
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((i * 10))
          done
          exit 1

  veroeffentlichen:
    needs: [tests, runde]
    if: >-
      always() && !cancelled() && github.ref == 'refs/heads/main' &&
      needs.tests.result == 'success' &&
      needs.runde.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    permissions:
      contents: read
      pages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Veröffentlichten Datenstand prüfen und bei Bedarf Pages erneut anstoßen
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/verify-pages.sh blaupause/data/welt.json
